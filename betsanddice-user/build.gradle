plugins {
        id 'java'
        id 'org.springframework.boot' version '3.4.4'
        id 'io.spring.dependency-management' version '1.1.7'
        id 'jacoco'
}

jar {
        manifest {
                attributes(
                        'Main-Class': 'com.betsanddice.user.App'
                )
        }
}

jacoco{
        toolVersion = '0.8.11'
        reportsDirectory = layout.buildDirectory.dir('jacocoXml')
}

group = 'com.betsanddice'

repositories {
    mavenCentral()
}

ext {
        set('springCloudVersion', "2024.0.1")
}

dependencies {

        compileOnly 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'
        testCompileOnly 'org.projectlombok:lombok:1.18.30'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

        implementation 'org.springframework.boot:spring-boot-autoconfigure'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-webflux'
        implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
        implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'

        implementation 'org.springframework.cloud:spring-cloud-starter-config'
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.cloud:spring-cloud-commons'

        implementation 'org.springframework:spring-context'
        implementation 'org.modelmapper:modelmapper:3.1.1'

        implementation 'org.apache.commons:commons-lang3:3.12.0'
        implementation 'commons-io:commons-io:2.14.0'
        implementation 'commons-validator:commons-validator:1.7'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework:spring-test'

        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.mockito:mockito-core:5.3.1'
        testImplementation 'org.hamcrest:hamcrest:2.2'
        testImplementation 'org.assertj:assertj-core:3.24.2'
        testImplementation 'io.projectreactor:reactor-test:3.1.0.RELEASE'
        testImplementation 'org.testcontainers:mongodb:1.17.6'
        testImplementation 'org.testcontainers:junit-jupiter:1.17.6'
        testImplementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.11'
        testImplementation 'com.squareup.okhttp3:mockwebserver3-junit5:5.0.0-alpha.11'
}

dependencyManagement {
        imports {
                mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
}

test {
        jvmArgs "-Xshare:off"
        useJUnitPlatform()
        finalizedBy jacocoTestReport
}

jacocoTestReport {
        dependsOn test
        reports {
                xml.required = true
                csv.required = false
                html.outputLocation =  layout.buildDirectory.dir('jacocoHtml')
        }
}

jacocoTestCoverageVerification {
        violationRules {
                rule {
                        limit {
                                counter = 'LINE'
                                value = 'COVEREDRATIO'
                                minimum = 0.7
                        }
                }
        }
}