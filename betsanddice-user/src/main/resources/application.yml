spring:
  application:
    name: betsanddice-user
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  data:
    mongodb:
      #uri para bbdd local:
      uri: mongodb://admin_user:XMOJocgKlmRHz2O@localhost:27017/users?authSource=admin
      #uri para bbdd docker:
      #uri: mongodb://admin_betsanddice:XMOJocgKlmRHz2O@mongodb-betsanddice:27017/users?authSource=admin
      uuid-representation: standard

springdoc:
  swagger-ui:
    path: "/swagger-ui-custom.html"
    operationsSorted: method
  api-docs:
    enable: true
    path: "/api-docs"

server:
  port: 8094

config:
  webclient:
    host: http://localhost:8095

management:
  endpoints:
    web:
      exposure:
        include: "*"
  security:
    enabled: false

url:
  connection_timeout: 30000
  maxBytesInMemory: 30000000

validation:
    number: "^\\d{1,9}$"
