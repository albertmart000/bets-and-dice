spring:
  application:
    name: "betsanddice-craps"
  profiles:
    active: "dev"
  data:
    mongodb:
      #uri para bbdd local:
      uri: mongodb://admin_game:XMOJocgKlmRHz2O@localhost:27017/games?authSource=admin
      #uri para bbdd docker:
      #uri: mongodb://admin_betsanddice:XMOJocgKlmRHz2O@mongodb-betsanddice:27017/craps?authSource=admin
      uuid-representation: standard
  cloud:
    compatibility-verifier:
      enabled: false
  config:
    import: "optional:configserver:http://localhost:8071/"

springdoc:
  swagger-ui:
    path: "/swagger-ui-custom.html"
    operationsSorted: method
  api-docs:
    enable: true
    path: "/api-docs"

server:
  port: 8095

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  security:
    enabled: false

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "betsanddice-craps"
    description: "Bet-And-Dice Craps Application"
    version: "1.0.0"

url:
  connection_timeout: 30000
  maxBytesInMemory: 30000000