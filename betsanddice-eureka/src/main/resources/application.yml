spring:
  application:
    name: betsanddice-eureka
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

server:
  port: 8070

eureka:
  instance:
    hostname: localhost
  client:
    fetchRegistry: false
    registerWithEureka: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/




